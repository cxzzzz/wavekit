[tool.poetry]
name = "wavekit"
version = "0.7.3"
description = "High-level digital waveform analysis in Python"
authors = ["cxzzzz <cxz19961010@outlook.com>"]
readme = "README.md"
repository = "https://github.com/cxzzzz/wavekit"
documentation = "https://cxzzzz.github.io/wavekit"
build = "build.py"
include = [
    { path = "src/wavekit/**/*.so", format = "wheel" },
]

[tool.poetry.dependencies]
python = "^3.9"
numpy = "^2.0.0"
vcdvcd = "^2.3.5"
pylibfst = "^0.2.1"
pytest = "^8.2.2"
lark = ">=1.2,<2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.2"
mypy = "^1.11.2"


[tool.poetry.group.docs.dependencies]
zensical = {version = "^0.0.57", python = ">=3.10,<4.0"}
mkdocstrings-python = {version = "1.18.2", python = ">=3.10,<4.0"}

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]
exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["B017"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.mypy]
python_version = "3.9"
files = ["src", "tests"]
exclude = ["^tmp/"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
check_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false
disable_error_code = ["misc"]

[build-system]
requires = ["poetry-core", "Cython", "setuptools", "wheel", "numpy>=2.0.0"]
build-backend = "poetry.core.masonry.api"
